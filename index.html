d?", "c": "Direct contact with body fluids", "w": ["Contaminated food and water only", "Contact with inanimate objects only", "Sewage and the fecal–oral route"], "e": "They are fragile and easily inactivated."}, {"g": "C1 · Capsid, envelope, transmission", "q": "An icosahedron has how many triangular faces?", "c": "20", "w": ["12", "60", "180"], "e": "Protein counts are multiples of 60."}, {"g": "C1 · Capsid, envelope, transmission", "q": "Where do herpesviruses acquire their envelope?", "c": "Host nuclear membrane", "w": ["Mitochondrial outer membrane", "Cell wall of the host", "Viral capsid lipids"], "e": "Budding through the nuclear membrane."}, {"g": "C1 · Capsid, envelope, transmission", "q": "What is a capsid's protective function?", "c": "Shields the genome from nucleases", "w": ["Synthesizes viral mRNA from the genome", "Cleaves the precursor polyprotein", "Integrates DNA into host cells"], "e": "Protein coat around DNA or RNA."}, {"g": "C1 · Capsid, envelope, transmission", "q": "What is the outer surface of a naked virus?", "c": "Capsid", "w": ["Envelope", "Matrix", "Genome"], "e": "In enveloped viruses the envelope is outer."}, {"g": "C1 · Surface and internal proteins", "q": "Which structures determine host and organ specificity?", "c": "Surface proteins that bind cell receptors", "w": ["Internal matrix proteins inside the virion", "The viral polymerase carried in the core", "The sequence of the genome alone"], "e": "Capsid (naked) or envelope (enveloped) proteins mediate attachment."}, {"g": "C1 · Surface and internal proteins", "q": "What is a serotype?", "c": "A subtype defined by surface antigens", "w": ["A subtype defined by the size of its genome", "A subtype defined by its preferred host species", "A subtype defined by its site of replication"], "e": "Antibody to one serotype does not neutralize another."}, {"g": "C1 · Surface and internal proteins", "q": "What is the role of the matrix protein?", "c": "Links capsid proteins to envelope proteins", age"], "e": "Excision leads to lysis."}, {"g": "C1 · Viral proteins and lysogeny", "q": "What is transduction?", "c": "Phage moving genes between bacteria", "w": ["Plasmid passing directly via pili", "Direct uptake of free DNA by a cell", "Mutation of a gene by UV exposure"], "e": "Viruses transfer bacterial genes."}, {"g": "C1 · Viral proteins and lysogeny", "q": "Which toxin comes from lysogenic conversion?", "c": "Diphtheria toxin", "w": ["Tetanus neurotoxin", "Anthrax edema toxin", "Pertussis toxin"], "e": "Prophage encodes the exotoxin."}, {"g": "C2 · Viral genetics", "q": "What is characteristic of temperature-sensitive mutants?", "c": "Replicate at low but not high temperature", "w": ["Replicate at high but not low temperature", "Replicate at any temperature", "Never replicate in any host cell"], "e": "Used in the influenza nasal spray vaccine."}, {"g": "C2 · Viral genetics", "q": "Reassortment occurs in which viruses?", "c": "Segmented RNA viruses such as influenza", "w": ["Naked DNA viruses such as adenoviruses", "Retroviruses such as HIV and nothing else", "Enveloped helical viruses of every type"], "e": "Influenza A reassortment underlies pandemic strains."}, {"g": "C2 · Viral genetics", "q": "Hepatitis D virus using HBV surface protein is an example of?", "c": "Complementation", "w": ["Reassortment", "Phenotypic mixing", "Lysogenic conversion"], "e": "HDV cannot replicate without HBV in the hepatocyte."}, {"g": "C2 · Viral genetics", "q": "What best describes phenotypic mixing?", "c": "Progeny coated with another virus's surface proteins", "w": ["Exchange of whole genome segments between two different viruses", "Integration of viral DNA into a host cell chromosome", "Mutation of a viral gene that appears only at high temperature"], "e": "It is temporary: the genome inside stays the same."}, {"g": "C2 · Viral genetics", "q": "What produces antigenic variation?", "c": "An error-prone polymerase", "w": ["Proofreading by the capsid", "Host DNA repair enzymes const $=id=>document.getElementById(id),E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
